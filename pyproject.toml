[project]
name = "gesture-control"
version = "0.1.0"
description = "Control a Linux desktop with hand gestures and voice dictation through a webcam"
authors = [
    { name = "Habib Farhan", email = "habibfarhan512@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "evdev>=2.0.0",
    "faster-whisper>=1.2.1",
    "mediapipe>=1.0.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12==9.*",
    "opencv-python>=5.0.0.93",
    "sounddevice>=0.5.6",
    "webrtcvad-wheels>=2.0.14",
]

[project.scripts]
gesture-control = "gesture_control:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
